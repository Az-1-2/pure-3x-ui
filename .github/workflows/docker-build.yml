name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v3.11.0)'
        required: true
        default: 'v3.11.0'

permissions:
  contents: write
  packages: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set version from tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Setting version to: $VERSION"
          echo -n "$VERSION" > internal/config/version

      - name: Strip ads before build
        run: bash scripts/remove-ads.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          IMAGE="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          VERSION="${TAG#v}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha,scope=x-ui \
            --cache-to type=gha,scope=x-ui,mode=max \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            --push .
