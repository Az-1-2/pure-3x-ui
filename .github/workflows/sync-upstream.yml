name: Sync Upstream

on:
  schedule:
    # Каждый день в 03:00 UTC (06:00 МСК)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/MHSanaei/3x-ui.git || true
          git fetch upstream main

          # Проверяем, есть ли новые коммиты
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          # ШАГ 1: Берём локали и update.sh из upstream напрямую
          # (это избегает конфликтов при merge)
          git checkout upstream/main -- internal/web/translation/ || true
          git checkout upstream/main -- update.sh || true

          # ШАГ 1.5: Коммитим эти изменения, чтобы merge не ругался
          git add -A
          git diff --cached --quiet || git commit -m "chore: take locales and update.sh from upstream (pre-merge)"

          # ШАГ 1.6: Удаляем файлы, которые вызывают modify/delete конфликт.
          # В нашем форке они не нужны, а upstream их меняет -> конфликт.
          # Удаляем ДО merge, чтобы -X theirs не спотыкался.
          git rm -f .github/workflows/claude-pr-review.yml 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: remove claude-pr-review.yml (pre-merge)" || true

          # ШАГ 2: Мержим остальные файлы с -X theirs
          # (при конфликте берётся версия upstream)
          if ! git merge upstream/main -X theirs --no-edit; then
            echo "=== MERGE CONFLICT - resolving ==="
            git status

            # Разрешаем modify/delete конфликты в пользу "удалить"
            for f in $(git diff --name-only --diff-filter=U); do
              if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                # Файл есть у нас -> берём upstream (theirs)
                git checkout --theirs "$f" 2>/dev/null || git rm -f "$f" 2>/dev/null || true
              else
                # Файл удалён у нас, но есть в upstream -> удаляем
                git rm -f "$f" 2>/dev/null || true
              fi
            done
            git add -A
            git commit --no-verify -m "chore: sync upstream (auto-resolve conflicts)" || true
          fi

          # Финальная страховка: удаляем claude-pr-review.yml после merge
          git rm -f .github/workflows/claude-pr-review.yml 2>/dev/null || true
          git diff --cached --quiet || git commit --no-verify -m "chore: remove claude-pr-review.yml (post-merge)" || true

      - name: Strip ads after upstream merge
        run: |
          bash scripts/remove-ads.sh
          git add -A
          git diff --cached --quiet || git commit -m "chore: auto strip ads after upstream merge"

      - name: Restore our workflows
        run: |
          # Не позволяем upstream перезаписывать наши workflows.
          # release.yml содержит x-ui-main и purge jsDelivr cache —
          # upstream-версия с xui-release ломает сборку.
          for f in \
            .github/workflows/release.yml \
            .github/workflows/docker.yml; do
            git checkout origin/main -- "$f" 2>/dev/null || true
          done
          git add -A
          git diff --cached --quiet || git commit -m "chore: keep our workflows (release.yml)" || true

      - name: Remove upstream CI (fork strips sponsor code)
        run: |
          # Upstream добавил ci.yml, который требует наличия рекламного
          # кода (sponsor.go с полями Until/Logo/Link, роут /sponsors в
          # endpoints.ts, файл claude-pr-review.yml). Мы их намеренно
          # удаляем, поэтому тесты upstream всегда будут падать.
          rm -f .github/workflows/ci.yml
          rm -f .github/workflows/claude-issue-analyst.yml
          rm -rf .github/claude/
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove upstream CI tests (fork strips sponsor code)"

      - name: Update upstream changelog
        run: |
          VERSION=$(cat internal/config/version 2>/dev/null | tr -d '[:space:]' || echo "")
          if [[ -z "$VERSION" ]]; then
            echo "No version file, skipping changelog update"
            exit 0
          fi

          TAG="v${VERSION}"
          DATE=$(date -u +"%Y-%m-%d")

          if grep -qE "\| ${TAG}[[:space:]]*\|" docs/upstream-changelog.md 2>/dev/null; then
            echo "Already in changelog: ${TAG}"
            exit 0
          fi

          echo "Adding ${TAG} to changelog"
          {
            echo "| ${DATE} | ${TAG} | см. upstream release notes | ⏸️ ждём тестирования |"
          } >> docs/upstream-changelog.md

          git add docs/upstream-changelog.md
          git diff --cached --quiet || git commit -m "docs: auto-update changelog for ${TAG}"

      - name: Format changelog after update
        run: |
          cd docs
          pnpm exec oxfmt upstream-changelog.md 2>/dev/null || true
          cd ..
          git add docs/upstream-changelog.md
          git diff --cached --quiet || git commit -m "style(docs): format upstream-changelog.md"

      - name: Push changes
        run: git push origin main
